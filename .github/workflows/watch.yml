name: internship-watch

on:
  schedule:
    # All times UTC. GitHub cron can lag several minutes under load, which is
    # fine -- postings stay open for days, not minutes.
    #
    # PEAK SEASON = Aug through Jan (months 8-12,1), when Summer 2027 roles
    # actually drop. Off-season is much quieter, so we back right off.
    # The three peak entries are written so they never overlap; a duplicate
    # trigger would just burn Actions minutes for nothing.

    # Peak, weekdays 12:00-23:00 UTC (08:00-19:00 ET) -- every 30 minutes.
    # This is US business hours, when postings genuinely go live. The repo is
    # public, so Actions minutes are unlimited and this costs nothing.
    - cron: "0,30 12-23 * 8-12,1 1-5"
    # Peak, overnight every day -- every 3 hours.
    - cron: "0 0,3,6,9 * 8-12,1 *"
    # Peak, weekend afternoons -- every 3 hours.
    - cron: "0 12,15,18,21 * 8-12,1 0,6"

    # Off-season (Feb-Jul) -- 3x a day is plenty.
    - cron: "0 2,10,18 * 2-7 *"

  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      notify_first_run:
        description: "Email the current backlog for any newly added source"
        type: boolean
        default: false

permissions:
  contents: write           # needed to commit state.json back to the repo

concurrency:
  group: internship-watch   # never let two runs race on state.json
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check career sites
        id: check
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Only needed if the USAJOBS source is enabled in config.yaml.
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          set +e
          # Scheduled runs leave this empty, so the flag is only ever added
          # when you tick the box on a manual run.
          FLAGS=""
          if [ "${{ inputs.notify_first_run }}" = "true" ]; then
            FLAGS="--notify-first-run"
            echo "Backlog mode: newly added sources will be emailed."
          fi
          python watcher.py $FLAGS
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = clean, 1 = ran but some source is unhealthy, 2 = email failed
          if [ "$code" -ge 2 ]; then exit "$code"; fi

      - name: Persist seen-postings state
        run: |
          git config user.name  "internship-watcher"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "no state change"
          fi

      - name: Flag unhealthy sources in the run summary
        if: steps.check.outputs.exit_code == '1'
        run: |
          echo "One or more sources failed to return data." >> "$GITHUB_STEP_SUMMARY"
          echo "You were emailed about it. Check the log above." >> "$GITHUB_STEP_SUMMARY"
