# ---------------------------------------------------------------------------
# Internship watcher config
#
# You are a sophomore in the 2026-27 academic year, so the target is
# SUMMER 2027 internships. Most of these postings open Aug 2026 - Jan 2027.
# ---------------------------------------------------------------------------

# Email digest settings (credentials live in .env / GitHub Secrets, not here)
email:
  subject_prefix: "[Internship Watch]"
  # If nothing new appears for this many days, send a short "still running"
  # note anyway. A silent watcher is indistinguishable from a broken one.
  heartbeat_days: 7

match:
  # ---------------------------------------------------------------------------
  # ELIGIBILITY PROFILE
  # Sophomore at Penn (2026-27), Mathematical Economics + Political Science,
  # targeting SUMMER 2027 internships. Lanes: business/corporate, economic
  # policy (Fed / IMF / World Bank / Treasury / think tanks), and
  # econ-consulting & research (Oliver Wyman ICG, Cornerstone Research).
  # Explicitly NOT traditional MBB management consulting.
  #
  # Classification is THREE-WAY, not keep/drop:
  #   match   looks like an early-career role AND carries an underclassman
  #           or Summer-2027 signal
  #   review  looks like an early-career role but eligibility or function is
  #           unclear -- surfaced for a human decision
  #   reject  not an early-career role at all, or demands standing/experience
  #           he does not have
  #
  # Ambiguity always becomes `review`. The bot never silently discards a
  # posting it merely failed to understand.
  # ---------------------------------------------------------------------------

  # STAGE 1 -- is this an early-career role at all? Failing this is a silent
  # reject, and it is what reduces a 1,800-posting corporate board to a
  # readable handful. Keep it generous.
  role_any:
    - intern
    - internship
    - "co-op"
    - coop
    - "summer analyst"
    - "summer associate"
    - "summer business analyst"
    - "summer scholar"
    - apprentice
    - student
    - "early career"
    - campus
    - undergraduate
    - "insight program"
    - "spring week"
    - sophomore
    - "launch program"
    - "explore program"
    - "analyst program"
    - "rotational program"
    - "development program"

  # Extra role words trusted ONLY for community-curated lists, where a
  # pipeline programme is the normal shape of a real opportunity.
  curated_role_extra:
    - program
    - programme
    - fellowship
    - scholars

  # STAGE 2 -- degrees or experience he does not have. Hard reject.
  hard_exclude:
    - mba
    - "ph.d"
    - phd
    - doctoral
    - postdoc
    - "advanced degree"
    - "experienced hire"
    - "master's student"
    - "masters student"
    - "master's"
    - masters
    - "law student"
    - "2+ years"
    - "3+ years"
    - "5+ years"
    - "two years of experience"
    - "three years of experience"
    - "years of professional experience"

  # STAGE 2b -- aimed only at people ahead of him in the pipeline.
  senior_only:
    - "rising senior"
    - "senior standing"
    - "junior standing"
    - "graduating 2026"
    - "class of 2026"
    - "class of 2027"
    - "final year"
    - "penultimate year"

  # STAGE 3 -- explicit underclassman or correct-cycle signal. Presence of any
  # of these promotes a posting from `review` to `match`.
  class_signals:
    - "2027"
    - "summer 2027"
    - sophomore
    - "second year"
    - "first year"
    - "rising junior"
    - underclassmen
    - underclassman
    - freshman
    - "class of 2028"
    - "class of 2029"
    - "all undergraduates"
    - "no class-year"
    - "open to all undergrads"

  # STAGE 4 -- which lane is this in? Matching no bucket yields `review`,
  # never a reject, so an unfamiliar title still reaches him.
  functions:
    econ_policy:
      - economist
      - economic
      - economics
      - econometric
      - policy
      - "public policy"
      - monetary
      - fiscal
      - macroeconomic
      - "central bank"
      - "international development"
      - "research assistant"
      - "research analyst"
      - "economic research"
      - "policy analyst"
      - treasury
      - statistics
      - statistical
    business:
      - "business analyst"
      - business
      - quantitative
      - quant
      - trading
      - trader
      - markets
      - econometrics
      - finance
      - financial
      - strategy
      - strategic
      - corporate
      - investment
      - "asset management"
      - portfolio
      - wealth
      - risk
      - operations
      - ops
      - "data analyst"
      - analytics
      - product
      - marketing
      - client
      - sales
      - accounting
      - audit
    consulting_adjacent:
      - "economic consulting"
      - litigation
      - antitrust
      - valuation
      - "expert testimony"
      - "competition economics"
      - consultant
      - consulting

  # Traditional MBB management consulting -- deliberately out of scope.
  # Checked BEFORE the function buckets, so "management consulting" rejects
  # even though "consulting" would otherwise match consulting_adjacent.
  function_exclude:
    - mckinsey
    - "bain &"
    - "bain and"
    - "boston consulting"
    - bcg
    - "management consulting"

  # Matching any of these sorts the posting to the top of the digest.
  priority_any:
    - "2027"
    - sophomore
    - "second year"
    - "first year"
    - "rising junior"
    - "summer 2027"
    - "open to all undergrads"

  locations_exclude:
    - india
    - brazil
    - brasil
    - colombia
    - mexico
    - chile
    - argentina
    - peru
    - "costa rica"
    - "dominican republic"
    - guatemala
    - panama
    - uruguay
    - canada
    - "united kingdom"
    - england
    - scotland
    - ireland
    - france
    - germany
    - spain
    - portugal
    - italy
    - netherlands
    - belgium
    - switzerland
    - sweden
    - denmark
    - norway
    - finland
    - poland
    - romania
    - hungary
    - czechia
    - austria
    - greece
    - latvia
    - lithuania
    - estonia
    - turkey
    - israel
    - "united arab emirates"
    - dubai
    - "saudi arabia"
    - qatar
    - egypt
    - "south africa"
    - nigeria
    - kenya
    - china
    - "hong kong"
    - taiwan
    - japan
    - korea
    - singapore
    - malaysia
    - indonesia
    - thailand
    - vietnam
    - philippines
    - australia
    - "new zealand"
    # Many boards give a city with a truncated or missing country
    # ("Toronto, ON" / "London, Eng" / "Netherlands - Amsterdam"), so the
    # major non-US hubs are listed by city name too.
    - toronto
    - ontario
    - montreal
    - vancouver
    - ottawa
    - london
    - dublin
    - amsterdam
    - paris
    - milan
    - madrid
    - munich
    - berlin
    - warsaw
    - prague
    - zurich
    - stockholm
    - "tel aviv"
    - bangalore
    - bengaluru
    - hyderabad
    - gurgaon
    - gurugram
    - noida
    - pune
    - mumbai
    - chennai
    - delhi
    - tokyo
    - taipei
    - beijing
    - shanghai
    - shenzhen
    - seoul
    - sydney
    - melbourne
    - "sao paulo"
    - bogota
    - santiago
    - lima
    - "buenos aires"
    - "mexico city"
    - guadalajara
    - cairo
    - nairobi
    - lagos

  # Optional strict allowlist, normally left empty. If you ever fill this in,
  # ONLY postings matching it survive -- which is how roles got lost before.
  locations_any: []

sources:
  # --- verified working -----------------------------------------------------
  - name: Mastercard
    type: workday
    host: mastercard.wd1.myworkdayjobs.com
    tenant: mastercard
    site: CorporateCareers
    # Workday ignores server-side search, so we pull the whole board and filter
    # locally. Raise max_results if the board grows past this.
    max_results: 1400

  - name: Visa
    type: workday
    host: visa.wd5.myworkdayjobs.com
    tenant: visa
    site: Visa
    max_results: 1400

  - name: EY / EY-Parthenon
    type: successfactors
    base_url: "https://careers.ey.com/ey"
    search_terms: ["intern", "summer", "parthenon"]
    max_results: 100

  # --- added later, all verified returning live postings -------------------
  - name: Capital One
    type: workday
    host: capitalone.wd12.myworkdayjobs.com
    tenant: capitalone
    site: Capital_One
    max_results: 2000

  - name: Amazon
    type: amazon_jobs
    search_terms: ["intern", "internship", "summer 2027"]
    countries: ["USA"]      # country_code is returned per job; far more
    max_results: 500        # reliable than parsing free-text city strings

  # --- public sector ---------------------------------------------------
  # One Workday board covers the whole Federal Reserve System: the Board of
  # Governors plus all 12 regional banks (including Philadelphia).
  - name: Federal Reserve System
    type: workday
    host: rb.wd5.myworkdayjobs.com
    tenant: rb
    site: FRS
    max_results: 600

  # Every federal internship, including Pathways. DISABLED until you add a
  # free API key -- it is the only source here that needs one.
  #   1. Request a key (instant, free): https://developer.usajobs.gov/apirequest/
  #   2. gh secret set USAJOBS_KEY      (paste the key)
  #      gh secret set USAJOBS_EMAIL    (the email you registered with)
  #   3. Change enabled below to true, then commit and push.
  - name: USAJOBS (federal)
    type: usajobs
    enabled: true
    search_terms: ["intern", "pathways student", "student trainee"]
    max_pages: 3

  # --- economic policy, finance & econ-research employers -------------------
  # All four Workday tenants verified live 2026-09-12 (postings returned:
  # Vanguard 444, T. Rowe Price 135, BlackRock 321, IMF 11).
  - name: Vanguard
    type: workday
    host: vanguard.wd5.myworkdayjobs.com
    tenant: vanguard
    site: vanguard_external
    max_results: 800

  - name: T. Rowe Price
    type: workday
    host: troweprice.wd5.myworkdayjobs.com
    tenant: troweprice
    site: TRowePrice
    max_results: 400

  - name: BlackRock
    type: workday
    host: blackrock.wd1.myworkdayjobs.com
    tenant: blackrock
    site: BlackRock_Professional
    max_results: 600

  # Small board by design -- the IMF posts few roles externally, so a low
  # count here is normal rather than a sign the source broke.
  - name: IMF
    type: workday
    host: imf.wd5.myworkdayjobs.com
    tenant: imf
    site: IMF
    max_results: 200
    may_be_empty: true

  - name: Google
    type: google_careers
    urls:
      - "https://www.google.com/about/careers/applications/jobs/results?target_level=INTERN_AND_APPRENTICE&location=United%20States&sort_by=date"
      - "https://www.google.com/about/careers/applications/jobs/results?q=intern%202027&location=United%20States&sort_by=date"

  # --- community-curated lists ---------------------------------------------
  # These are usually the FIRST place a sophomore-eligible posting shows up --
  # often days before the company's own careers page is worth checking.
  #
  # The three underclassmen repos are already curated for your class year, so
  # they run with `filter: false` (every row is relevant by definition and the
  # keyword filter would wrongly drop entries like "Microsoft Explore").

  - name: "Underclassmen Opportunities (Cruz-Lopez)"
    type: github_markdown
    repo: Jose-Gael-Cruz-Lopez/underclassmen-opportunities
    branch: main
    filter: false
    # This repo lists scholarships and state tuition grants alongside real
    # internships. Two passes remove them: whole tables whose columns give
    # them away, then individual scholarship rows hiding in the mixed
    # "Opportunity" tables (UNCF, Posse, National Merit).
    skip_tables_with: ["scholarship", "amount", "award"]
    exclude_terms:
      - scholarship
      - scholarships
      - tuition
      - grant
      - "financial aid"
      - "student aid"
      # Aimed at high schoolers, not college sophomores.
      - "hs senior"
      - "high school"
      - "essay contest"

  - name: "Underclassmen Opportunities (LuisaE)"
    type: github_markdown
    repo: LuisaE/opportunities
    branch: master
    filter: false

  - name: "Underclassmen Internships (zapplyjobs)"
    type: github_markdown
    repo: zapplyjobs/underclassmen-internships
    branch: main
    filter: false

  # Not underclassmen-specific and much larger, so the keyword/location filter
  # stays ON here to keep the volume sane.
  - name: "Summer 2027 Internships (vanshb03)"
    type: github_markdown
    repo: vanshb03/Summer2027-Internships
    branch: main

  # Publishes an explicit Open / Not Yet Open status per program, so this
  # catches the exact moment a PM/APM internship opens.
  - name: "APM List (PM internships)"
    type: apmlist
    buckets: ["internship"]
    statuses: ["Open"]
    may_be_empty: true

# ---------------------------------------------------------------------------
# Deliberately NOT included, and why:
#
#   simplify.jobs/dashboard
#       Your personal logged-in dashboard. Scraping it needs your session
#       cookie, which would mean storing your credentials in a repo. Not worth
#       it -- Simplify's underlying listings largely mirror the GitHub repos
#       above, which are public and need no auth. Keep using Simplify manually
#       for autofill and tracking.
#
#   intern-list.com
#       Renders client-side from jobright.ai. Its only public endpoint returns
#       aggregate counts (166k jobs), not listings, and it is not curated for
#       underclassmen. Nothing reliable to parse.
#
#   interninsider.me
#       Listings are injected by JavaScript; the served HTML has no job data.
#       Would need a headless browser for a source that mostly duplicates the
#       repos above.
# ---------------------------------------------------------------------------
